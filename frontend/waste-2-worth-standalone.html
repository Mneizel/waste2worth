l:"media/steps/drip-irrigation-spike-1.svg",tip:"",warning:"",icon:"🧼"},{stepNumber:2,title:"Make tiny holes in the cap",instruction:"An adult makes 2 to 4 very small holes in the cap.",imageUrl:"media/steps/drip-irrigation-spike-2.svg",tip:"",warning:"Adults only.",icon:"🕳️"},{stepNumber:3,title:"Add a hole near the base",instruction:"Make one small hole in the bottom of the bottle so air can get in.",imageUrl:"media/steps/drip-irrigation-spike-3.svg",tip:"",warning:"",icon:"💨"},{stepNumber:4,title:"Fill with water",instruction:"Fill the bottle with water and screw the cap on.",imageUrl:"media/steps/drip-irrigation-spike-4.svg",tip:"",warning:"",icon:"💧"},{stepNumber:5,title:"Push it into the soil",instruction:"Turn the bottle upside down and push the cap end into the soil next to your plant.",imageUrl:"media/steps/drip-irrigation-spike-5.svg",tip:"Firm the soil around it so it stands up.",warning:"",icon:"🌱"},{stepNumber:6,title:"Let it work",instruction:"The water drips out slowly over a few days. Refill when empty.",imageUrl:"media/steps/drip-irrigation-spike-6.svg",tip:"",warning:"",icon:"⏳"}],variantKeys:["pet-water-500ml","pet-water-600ml","pet-water-1000ml","pet-water-1500ml"]},{id:"idea-kids-bowling-set",slug:"kids-bowling-set",title:"Bottle bowling set",summary:"Six bottles become skittles. Add a little water for weight and knock them down with a ball.",difficulty:"easy",estimatedMinutes:30,minAge:5,safetyNotes:"Keep caps tight so no water spills. Play away from stairs.",thumbnailUrl:"media/ideas/kids-bowling-set-thumb.svg",finalImageUrl:"media/ideas/kids-bowling-set-final.svg",model3dUrl:"media/models/kids-bowling-set.glb",model3dPreviewUrl:"media/ideas/kids-bowling-set-3d.svg",tools:[{id:"tool-kids-bowling-set-0",kind:"material",name:"Clean plastic bottles with caps",imageUrl:"",quantity:"6",optional:!1,note:""},{id:"tool-kids-bowling-set-1",kind:"material",name:"A small soft ball",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-kids-bowling-set-2",kind:"material",name:"Coloured tape or paint",imageUrl:"",quantity:"1",optional:!0,note:""},{id:"tool-kids-bowling-set-3",kind:"material",name:"Water or sand",imageUrl:"",quantity:"a little",optional:!1,note:"For weight."}],steps:[{stepNumber:1,title:"Clean six bottles",instruction:"Wash six bottles and their caps and take off the labels.",imageUrl:"media/steps/kids-bowling-set-1.svg",tip:"",warning:"",icon:"🧼"},{stepNumber:2,title:"Add a little weight",instruction:"Put a few centimetres of water or dry sand in each bottle so they do not fall over in the wind.",imageUrl:"media/steps/kids-bowling-set-2.svg",tip:"",warning:"",icon:"⚖️"},{stepNumber:3,title:"Close them tightly",instruction:"Screw every cap on firmly. Check none leak.",imageUrl:"media/steps/kids-bowling-set-3.svg",tip:"",warning:"",icon:"🔩"},{stepNumber:4,title:"Decorate the pins",instruction:"Wrap each bottle with coloured tape or paint numbers on them.",imageUrl:"media/steps/kids-bowling-set-4.svg",tip:"",warning:"",icon:"🎨"},{stepNumber:5,title:"Set up the triangle",instruction:"Stand the bottles in a triangle: one at the front, then two, then three.",imageUrl:"media/steps/kids-bowling-set-5.svg",tip:"",warning:"",icon:"🔺"},{stepNumber:6,title:"Roll the ball",instruction:"Step back a few steps and roll the ball to knock the pins down.",imageUrl:"media/steps/kids-bowling-set-6.svg",tip:"Count how many you knock down each turn.",warning:"",icon:"🎳"}],variantKeys:["pet-water-500ml","pet-water-600ml","pet-softdrink-330ml"]},{id:"idea-wind-spinner",slug:"wind-spinner",title:"Garden wind spinner",summary:"Cut fins into a bottle so it spins and shimmers when the wind blows.",difficulty:"medium",estimatedMinutes:35,minAge:8,safetyNotes:"An adult should do all the cutting. The fins have sharp corners — round them off.",thumbnailUrl:"media/ideas/wind-spinner-thumb.svg",finalImageUrl:"media/ideas/wind-spinner-final.svg",model3dUrl:"media/models/wind-spinner.glb",model3dPreviewUrl:"media/ideas/wind-spinner-3d.svg",tools:[{id:"tool-wind-spinner-0",kind:"tool",name:"Craft knife",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-wind-spinner-1",kind:"tool",name:"Scissors",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-wind-spinner-2",kind:"tool",name:"Marker pen",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-wind-spinner-3",kind:"material",name:"The clean plastic bottle with its cap",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-wind-spinner-4",kind:"material",name:"String",imageUrl:"",quantity:"30 cm",optional:!1,note:""},{id:"tool-wind-spinner-5",kind:"material",name:"Reflective stickers or paint",imageUrl:"",quantity:"1",optional:!0,note:""}],steps:[{stepNumber:1,title:"Clean the bottle",instruction:"Wash and dry the bottle. Keep the cap on.",imageUrl:"media/steps/wind-spinner-1.svg",tip:"",warning:"",icon:"🧼"},{stepNumber:2,title:"Draw the fin lines",instruction:"Draw 6 to 8 straight lines down the middle section of the bottle, evenly spaced.",imageUrl:"media/steps/wind-spinner-2.svg",tip:"",warning:"",icon:"✏️"},{stepNumber:3,title:"Cut the fins",instruction:"An adult cuts along each line, only through the middle section, not the ends.",imageUrl:"media/steps/wind-spinner-3.svg",tip:"",warning:"Adults only for cutting.",icon:"✂️"},{stepNumber:4,title:"Twist the fins",instruction:"Gently push the top and bottom of the bottle toward each other and twist a little so the fins bend outward.",imageUrl:"media/steps/wind-spinner-4.svg",tip:"",warning:"",icon:"🌀"},{stepNumber:5,title:"Round the corners",instruction:"Snip the sharp corners off each fin with scissors.",imageUrl:"media/steps/wind-spinner-5.svg",tip:"",warning:"",icon:"🔵"},{stepNumber:6,title:"Decorate",instruction:"Add reflective stickers or paint spots so it catches the light.",imageUrl:"media/steps/wind-spinner-6.svg",tip:"",warning:"",icon:"✨"},{stepNumber:7,title:"Make a hanger",instruction:"An adult makes a small hole in the base. Thread the string through and tie a loop.",imageUrl:"media/steps/wind-spinner-7.svg",tip:"",warning:"",icon:"🪢"},{stepNumber:8,title:"Hang it outside",instruction:"Hang the spinner from a branch or hook where the wind can reach it.",imageUrl:"media/steps/wind-spinner-8.svg",tip:"",warning:"",icon:"🍃"}],variantKeys:["pet-water-500ml","pet-water-600ml","pet-sports-750ml"]},{id:"idea-vertical-herb-garden",slug:"vertical-herb-garden",title:"Hanging herb garden",summary:"Bottles laid on their side and hung in a row make a small wall garden for herbs.",difficulty:"medium",estimatedMinutes:40,minAge:9,safetyNotes:"An adult should cut the openings and make the holes. Hang it on a strong hook.",thumbnailUrl:"media/ideas/vertical-herb-garden-thumb.svg",finalImageUrl:"media/ideas/vertical-herb-garden-final.svg",model3dUrl:"media/models/vertical-herb-garden.glb",model3dPreviewUrl:"media/ideas/vertical-herb-garden-3d.svg",tools:[{id:"tool-vertical-herb-garden-0",kind:"tool",name:"Craft knife",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-vertical-herb-garden-1",kind:"tool",name:"Marker pen",imageUrl:"",quantity:"1",optional:!1,note:""},{id:"tool-vertical-herb-garden-2",kind:"tool",name:"A nail",imageUrl:"",quantity:"1",optional:!1,note:"For drainage and rope holes."},{id:"tool-vertical-herb-garden-3",kind:"material",name:"Clean plastic bottles with caps",imageUrl:"",quantity:"3",optional:!1,note:""},{id:"tool-vertical-herb-garden-4",kind:"material",name:"Strong rope or cord",imageUrl:"",quantity:"2 m",optional:!1,note:""},{id:"tool-vertical-herb-garden-5",kind:"material",name:"Potting soil",imageUrl:"",quantity:"3 handfuls",optional:!1,note:""},{id:"tool-vertical-herb-garden-6",kind:"material",name:"Herb seedlings or seeds",imageUrl:"",quantity:"3",optional:!1,note:""}],steps:[{stepNumber:1,title:"Clean the bottles",instruction:"Wash three bottles and caps and take off the labels.",imageUrl:"media/steps/vertical-herb-garden-1.svg",tip:"",warning:"",icon:"🧼"},{stepNumber:2,title:"Lay a bottle on its side",instruc
